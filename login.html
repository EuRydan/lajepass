<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Comu Pass | Painel do Usuário</title>
  <meta name="description" content="Acesse sua conta na Comu para ver seus ingressos, benefícios do Comu Pass e experiências salvas." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg-primary);
      position: relative;
      overflow-x: hidden;
    }

    .auth-header {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(12, 8, 23, 0.8);
      backdrop-filter: blur(12px);
    }

    .auth-header__logo img {
      height: 38px;
      width: auto;
    }

    .auth-header__back {
      color: var(--color-text-secondary);
      text-decoration: none;
      font-family: var(--font-display);
      font-size: var(--text-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s ease;
    }

    .auth-header__back:hover {
      color: #ffffff;
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .auth-bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 1, 73, 0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #150d2b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }

    .auth-card__badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 1, 73, 0.15);
      color: var(--color-accent);
      border: 1px solid rgba(255, 1, 73, 0.3);
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      margin-bottom: 1.25rem;
    }

    .auth-card__title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .auth-card__subtitle {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .auth-form .form-group {
      margin-bottom: 0;
    }

    .auth-form .form-label {
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .auth-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input-icon {
      position: absolute;
      left: 1rem;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .auth-form .form-input {
      padding-left: 2.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.95rem;
      height: 48px;
      transition: all 0.2s ease;
    }

    .auth-form .form-input:focus {
      border-color: var(--color-accent);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      outline: none;
    }

    .auth-submit-btn {
      margin-top: 0.5rem;
      height: 48px;
      font-size: 0.85rem;
      border-radius: 6px;
      font-weight: 800;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .auth-alt-btn {
      width: 100%;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .auth-alt-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .auth-card__footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--color-text-secondary);
    }

    .auth-card__footer a {
      color: var(--color-accent);
      font-weight: 700;
      text-decoration: none;
      margin-left: 0.25rem;
    }

    .auth-card__footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="auth-header">
    <a href="index.html" class="auth-header__logo">
      <img src="public/Comu logo.svg" alt="Comu Pass" />
    </a>
    <a href="index.html" class="auth-header__back">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Voltar ao início</span>
    </a>
  </header>

  <!-- Main Login Card -->
  <main class="auth-main">
    <div class="auth-bg-glow"></div>
    
    <div class="auth-card">
      <span class="auth-card__badge">
        <i class="fa-solid fa-shield-halved"></i> Painel do Usuário
      </span>

      <h1 class="auth-card__title">Bem-vindo(a) de volta</h1>
      <p class="auth-card__subtitle">
        Acesse seus ingressos, benefícios exclusivos e experiências salvas na Comu.
      </p>

      <form class="auth-form" onsubmit="event.preventDefault(); alert('Em breve: login e painel do usuário integrado!');">
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail ou WhatsApp</label>
          <div class="auth-input-wrapper">
            <i class="fa-solid fa-envelope auth-input-icon"></i>
            <input type="text" id="login-email" class="form-input" placeholder="seu@email.com ou (21) 99999-9999" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Senha / Código de Acesso</label>
          <div class="auth-input-wrapper">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--full auth-submit-btn">
          <span>ACESSAR PAINEL</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-divider">ou</div>

      <a href="https://chat.whatsapp.com/CaifVi3wOTmDLgZnw5arJS" target="_blank" rel="noopener noreferrer" class="auth-alt-btn">
        <i class="fa-brands fa-whatsapp" style="color: #25D366; font-size: 1.1rem;"></i>
        <span>Entrar via Radar WhatsApp</span>
      </a>

      <div class="auth-card__footer">
        Ainda não tem acesso VIP?
        <a href="index.html#pass">Fazer parte do Pass</a>
      </div>
    </div>
  </main>

</body>
</html>
